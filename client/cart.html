<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">

            🛒 GroceryHub

        </div>

        <button onclick="window.location.href='index.html'">

            Continue Shopping

        </button>

    </nav>

</header>

<main>

    <section class="cart-page">

        <h2>Your Shopping Cart</h2>

        <div id="emptyCart" style="display:block">
            <h2>Your Cart is Empty 🛒</h2>
            <p>Browse our products and add items to your cart.</p>
            <button class="shop-btn" onclick="window.location.href='index.html'">Start Shopping</button>
        </div>

        <div id="cartContainer" style="display:none">
            <div id="cartItems"></div>

            <div class="cart-summary">
                <p>Total Items: <span id="totalItems">0</span></p>
                <h3>Total: ₹<span id="totalPrice">0</span></h3>
            </div>

            <div class="cart-actions">
                <button class="shop-btn" onclick="window.location.href='checkout.html'">
                    Proceed to Checkout
                </button>
                <button class="remove-btn" onclick="clearCart()" style="margin-top:10px">
                    🗑️ Clear Cart
                </button>
            </div>
        </div>

    </section>

</main>

<script src="./js/api.js"></script>
<script src="./js/cart.js"></script>

<div id="toast"></div>

</body>

</html>
