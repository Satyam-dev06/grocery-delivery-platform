<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Successful - GroceryHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header role="banner">
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="logo">🛒 GroceryHub</div>
    <button onclick="window.location.href='index.html'">🏠 Home</button>
  </nav>
</header>

<main id="main-content" role="main">
  <section class="checkout" style="text-align:center;">
    <div style="font-size:80px;margin-bottom:20px;">🎉</div>
    <h1 style="color:#2E7D32;margin-bottom:20px;">Order Placed Successfully!</h1>
    <p style="font-size:18px;color:#555;margin-bottom:10px;">
      Thank you for shopping with GroceryHub.
    </p>
    <p style="font-size:16px;color:#888;margin-bottom:40px;">
      Your order has been placed and is being processed.
    </p>

    <div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;">
      <button class="shop-btn" onclick="window.location.href='orders.html'" style="padding:16px 36px;">
        📦 View My Orders
      </button>
      <button class="category-btn" onclick="window.location.href='index.html'" style="padding:16px 36px;">
        🏠 Continue Shopping
      </button>
    </div>
  </section>
</main>

<button id="scrollTop"><i class="fas fa-arrow-up"></i></button>
<script src="./js/scroll-top.js"></script>
</body>
</html>
