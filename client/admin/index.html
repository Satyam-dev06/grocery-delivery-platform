<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - Admin - GroceryHub</title>
  <link rel="stylesheet" href="../css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="admin-body">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()" aria-hidden="true"></div>
  <a href="#mainContent" class="skip-link">Skip to main content</a>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar" role="navigation" aria-label="Admin Navigation">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fas fa-leaf"></i></div>
      <h2>GroceryHub</h2>
      <p>Admin Panel</p>
    </div>
    <ul class="nav-list">
      <li><a href="index.html" class="active" aria-current="page"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
      <li><a href="products.html"><i class="fas fa-boxes"></i><span>Products</span></a></li>
      <li><a href="orders.html"><i class="fas fa-truck"></i><span>Orders</span></a></li>
      <li><a href="users.html"><i class="fas fa-users"></i><span>Users</span></a></li>
      <li><a href="payments.html"><i class="fas fa-credit-card"></i><span>Payments</span></a></li>
      <li><a href="coupons.html"><i class="fas fa-tag"></i><span>Coupons</span></a></li>
      <li><a href="settings.html"><i class="fas fa-cog"></i><span>Settings</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <a href="#" onclick="logoutUser();return false;"><i class="fas fa-right-from-bracket"></i> <span>Logout</span></a>
    </div>
  </aside>

  <!-- Top Header -->
  <header class="admin-topbar" role="banner">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
      <h1 class="page-title">Analytics Dashboard</h1>
    </div>
    <div class="topbar-right">
      <div class="admin-user-profile" id="adminUser">
        <div class="avatar"><i class="fas fa-user-shield"></i></div>
        <div class="user-info">
          <span class="user-name">Loading...</span>
          <span class="user-role">Administrator</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main" id="mainContent">
    <!-- Date Filter Bar -->
    <div class="ad-filter-bar">
      <div class="ad-filter-group">
        <button class="ad-filter-btn active" data-range="today">Today</button>
        <button class="ad-filter-btn" data-range="7days">Last 7 Days</button>
        <button class="ad-filter-btn" data-range="30days">Last 30 Days</button>
        <button class="ad-filter-btn" data-range="month">This Month</button>
        <button class="ad-filter-btn" data-range="custom">Custom</button>
      </div>
      <div class="ad-custom-date" id="customDateRange" style="display:none;">
        <label><i class="fas fa-calendar"></i> From <input type="date" id="startDate"></label>
        <label><i class="fas fa-calendar"></i> To <input type="date" id="endDate"></label>
        <button class="ad-apply-btn" onclick="applyAnalytics()">Apply</button>
      </div>
      <div class="ad-export-group">
        <button class="ad-export-btn pdf" onclick="exportPDF()" title="Export PDF"><i class="fas fa-file-pdf"></i> PDF</button>
        <button class="ad-export-btn excel" onclick="exportExcel()" title="Export Excel"><i class="fas fa-file-excel"></i> Excel</button>
        <button class="ad-export-btn refresh" onclick="loadAnalytics()" title="Refresh"><i class="fas fa-sync-alt"></i></button>
      </div>
    </div>

    <div id="dashboardContent">
      <div class="ad-loading"><div class="ad-spinner"></div><p>Loading analytics...</p></div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
