<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Admin - GroceryHub</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()" aria-hidden="true"></div>
  <a href="#settingsContent" class="skip-link">Skip to main content</a>

  <aside class="admin-sidebar" id="adminSidebar" role="navigation" aria-label="Admin Navigation">
    <div class="sidebar-header">
      <div class="logo-icon" aria-hidden="true"><i class="fas fa-leaf"></i></div>
      <h2>GroceryHub</h2>
      <p>Admin Panel</p>
    </div>
    <ul class="nav-list">
      <li><a href="index.html"><span class="nav-icon"><i class="fas fa-chart-pie"></i></span><span class="nav-label">Dashboard</span></a></li>
      <li><a href="products.html"><span class="nav-icon"><i class="fas fa-boxes"></i></span><span class="nav-label">Products</span></a></li>
      <li><a href="orders.html"><span class="nav-icon"><i class="fas fa-truck"></i></span><span class="nav-label">Orders</span></a></li>
      <li><a href="users.html"><span class="nav-icon"><i class="fas fa-users"></i></span><span class="nav-label">Users</span></a></li>
      <li><a href="payments.html"><span class="nav-icon"><i class="fas fa-credit-card"></i></span><span class="nav-label">Payments</span></a></li>
      <li><a href="coupons.html"><span class="nav-icon"><i class="fas fa-tag"></i></span><span class="nav-label">Coupons</span></a></li>
      <li><a href="analytics.html"><span class="nav-icon"><i class="fas fa-chart-line"></i></span><span class="nav-label">Analytics</span></a></li>
      <li><a href="settings.html" class="active" aria-current="page"><span class="nav-icon"><i class="fas fa-cog"></i></span><span class="nav-label">Settings</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <a href="#" onclick="logoutUser();return false;" aria-label="Logout"><i class="fas fa-right-from-bracket"></i> <span>Logout</span></a>
    </div>
  </aside>

  <header class="admin-topbar" role="banner">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
      <h1 class="page-title">Settings</h1>
    </div>
    <div class="topbar-search" role="search">
      <i class="fas fa-search search-icon" aria-hidden="true"></i>
      <input type="search" placeholder="Search settings..." aria-label="Search settings">
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notification-dot"></span></button>
      <div class="admin-user-profile" id="adminUser"><div class="avatar"><i class="fas fa-user-shield"></i></div><div class="user-info"><span class="user-name">Admin</span><span class="user-role">Administrator</span></div></div>
      <button class="logout-btn" onclick="logoutUser()" aria-label="Logout"><i class="fas fa-right-from-bracket"></i><span>Logout</span></button>
    </div>
  </header>

  <main class="admin-main">
    <div class="settings-container">
      <div class="settings-card">
        <div class="settings-header">
          <h3><i class="fas fa-cog"></i> Store Settings</h3>
        </div>
        <div class="settings-body">
          <form id="settingsForm" onsubmit="saveSettings(event)">
            <div class="admin-form-group">
              <label><i class="fas fa-store"></i> Store Name</label>
              <input id="setStoreName" required>
            </div>
            <div class="admin-form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div>
                <label><i class="fas fa-envelope"></i> Support Email</label>
                <input id="setEmail" type="email">
              </div>
              <div>
                <label><i class="fas fa-phone"></i> Support Phone</label>
                <input id="setPhone">
              </div>
            </div>
            <div class="admin-form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div>
                <label><i class="fas fa-indian-rupee-sign"></i> Delivery Charge</label>
                <input id="setDeliveryCharge" type="number" step="1">
              </div>
              <div>
                <label><i class="fas fa-gift"></i> Free Delivery Above</label>
                <input id="setFreeDelivery" type="number" step="1">
              </div>
            </div>
            <div class="admin-form-group" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;">
              <div>
                <label><i class="fas fa-percent"></i> Tax (%)</label>
                <input id="setTax" type="number" step="0.1">
              </div>
              <div>
                <label><i class="fas fa-globe"></i> Currency</label>
                <input id="setCurrency" value="INR">
              </div>
              <div>
                <label><i class="fas fa-indian-rupee-sign"></i> Symbol</label>
                <input id="setCurrencySymbol" value="₹">
              </div>
            </div>
            <div class="admin-form-group">
              <label><i class="fas fa-image"></i> Logo URL</label>
              <input id="setLogo" placeholder="URL to logo image">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:10px;"><i class="fas fa-save"></i> Save Settings</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
