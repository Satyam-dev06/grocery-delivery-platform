<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products - Admin - GroceryHub</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()" aria-hidden="true"></div>
  <a href="#productsContent" class="skip-link">Skip to main content</a>

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar" role="navigation" aria-label="Admin Navigation">
    <div class="sidebar-header">
      <div class="logo-icon" aria-hidden="true"><i class="fas fa-leaf"></i></div>
      <h2>GroceryHub</h2>
      <p>Admin Panel</p>
    </div>
    <ul class="nav-list">
      <li><a href="index.html"><span class="nav-icon"><i class="fas fa-chart-pie"></i></span><span class="nav-label">Dashboard</span></a></li>
      <li><a href="products.html" class="active" aria-current="page"><span class="nav-icon"><i class="fas fa-boxes"></i></span><span class="nav-label">Products</span></a></li>
      <li><a href="orders.html"><span class="nav-icon"><i class="fas fa-truck"></i></span><span class="nav-label">Orders</span></a></li>
      <li><a href="users.html"><span class="nav-icon"><i class="fas fa-users"></i></span><span class="nav-label">Users</span></a></li>
      <li><a href="payments.html"><span class="nav-icon"><i class="fas fa-credit-card"></i></span><span class="nav-label">Payments</span></a></li>
      <li><a href="coupons.html"><span class="nav-icon"><i class="fas fa-tag"></i></span><span class="nav-label">Coupons</span></a></li>
      <li><a href="analytics.html"><span class="nav-icon"><i class="fas fa-chart-line"></i></span><span class="nav-label">Analytics</span></a></li>
      <li><a href="settings.html"><span class="nav-icon"><i class="fas fa-cog"></i></span><span class="nav-label">Settings</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <a href="#" onclick="logoutUser();return false;" aria-label="Logout"><i class="fas fa-right-from-bracket"></i> <span>Logout</span></a>
    </div>
  </aside>

  <!-- Top Header -->
  <header class="admin-topbar" role="banner">
    <div class="topbar-left">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle sidebar" aria-expanded="false">
        <i class="fas fa-bars"></i>
      </button>
      <h1 class="page-title">Products</h1>
    </div>
    <div class="topbar-search" role="search">
      <i class="fas fa-search search-icon" aria-hidden="true"></i>
      <input type="search" placeholder="Search products..." aria-label="Search products">
    </div>
    <div class="topbar-right">
      <button class="topbar-btn" aria-label="Notifications"><i class="fas fa-bell"></i><span class="notification-dot"></span></button>
      <div class="admin-user-profile" id="adminUser"><div class="avatar"><i class="fas fa-user-shield"></i></div><div class="user-info"><span class="user-name">Admin</span><span class="user-role">Administrator</span></div></div>
      <button class="logout-btn" onclick="logoutUser()" aria-label="Logout"><i class="fas fa-right-from-bracket"></i><span>Logout</span></button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="admin-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
      <div class="search-bar">
        <div class="search-input-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="productSearch" placeholder="Search by name or category..." onkeyup="if(event.key==='Enter')loadProducts()" aria-label="Search products">
        </div>
      </div>
      <button class="btn btn-primary" onclick="openProductModal()"><i class="fas fa-plus"></i> Add Product</button>
    </div>
    <div id="productsContent">
      <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><span class="spinner-text">Loading products...</span></div>
    </div>
  </main>

  <!-- Product Modal -->
  <div class="modal-overlay" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
    <div class="modal-box">
      <h3 id="productModalTitle"><i class="fas fa-boxes"></i> Add Product</h3>
      <form id="productForm" onsubmit="saveProduct(event)">
        <input type="hidden" id="editProductId">
        <div class="admin-form-group">
          <label><i class="fas fa-tag"></i> Product Name</label>
          <input id="prodName" required>
        </div>
        <div class="admin-form-group">
          <label><i class="fas fa-folder"></i> Category</label>
          <input id="prodCategory" required>
        </div>
        <div class="admin-form-group">
          <label><i class="fas fa-building"></i> Brand</label>
          <input id="prodBrand" placeholder="e.g. Amul, Tata, Britannia">
        </div>
        <div class="admin-form-group">
          <label><i class="fas fa-align-left"></i> Description</label>
          <textarea id="prodDescription" rows="3"></textarea>
        </div>
        <div class="admin-form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <label><i class="fas fa-indian-rupee-sign"></i> Price</label>
            <input id="prodPrice" type="number" step="0.01" required>
          </div>
          <div>
            <label><i class="fas fa-indian-rupee-sign"></i> Old Price</label>
            <input id="prodOldPrice" type="number" step="0.01" value="0">
          </div>
        </div>
        <div class="admin-form-group">
          <label><i class="fas fa-image"></i> Image URL</label>
          <input id="prodImage" required>
        </div>
        <div class="admin-form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <label><i class="fas fa-star"></i> Rating (1-5)</label>
            <input id="prodRating" type="number" min="1" max="5" value="5">
          </div>
          <div>
            <label class="toggle-label">
              <input id="prodStock" type="checkbox" checked> <i class="fas fa-check-circle" style="color:#2E7D32;"></i> In Stock
            </label>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
          <label class="toggle-label"><input id="prodFeatured" type="checkbox"> <i class="fas fa-star"></i> Featured</label>
          <label class="toggle-label"><input id="prodTrending" type="checkbox"> <i class="fas fa-fire"></i> Trending</label>
          <label class="toggle-label"><input id="prodRecommended" type="checkbox"> <i class="fas fa-thumbs-up"></i> Recommended</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" onclick="closeProductModal()"><i class="fas fa-times"></i> Cancel</button>
          <button type="submit" class="btn btn-primary" id="productSaveBtn"><i class="fas fa-check"></i> Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
