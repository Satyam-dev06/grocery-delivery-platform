<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - GroceryHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header role="banner">
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="logo">🛒 GroceryHub</div>
    <div class="nav-actions">
      <button onclick="window.location.href='index.html'">🏠 Home</button>
      <button onclick="window.location.href='cart.html'">🛒 Cart</button>
      <button class="login-btn" onclick="window.location.href='login.html'">Login</button>
    </div>
  </nav>
</header>

<main id="main-content" role="main">
  <section class="orders-page">
    <h2>📦 My Orders</h2>
    <div id="ordersContainer">
      <!-- Skeleton Loading -->
      <div class="sk-order-card" id="orderSkeleton">
        <div class="sk-order-header">
          <div class="sk-line w30"></div>
          <div class="sk-line w20"></div>
        </div>
        <div class="sk-order-body">
          <div><div class="sk-line w60" style="margin-bottom:8px;"></div><div class="sk-line w40"></div></div>
          <div class="sk-line h24 w30"></div>
        </div>
        <div><div class="sk-btn-block w40"></div></div>
      </div>
      <div class="sk-order-card">
        <div class="sk-order-header">
          <div class="sk-line w30"></div>
          <div class="sk-line w20"></div>
        </div>
        <div class="sk-order-body">
          <div><div class="sk-line w60" style="margin-bottom:8px;"></div><div class="sk-line w40"></div></div>
          <div class="sk-line h24 w30"></div>
        </div>
        <div><div class="sk-btn-block w40"></div></div>
      </div>
      <div class="sk-order-card">
        <div class="sk-order-header">
          <div class="sk-line w30"></div>
          <div class="sk-line w20"></div>
        </div>
        <div class="sk-order-body">
          <div><div class="sk-line w60" style="margin-bottom:8px;"></div><div class="sk-line w40"></div></div>
          <div class="sk-line h24 w30"></div>
        </div>
        <div><div class="sk-btn-block w40"></div></div>
      </div>
    </div>
  </section>
</main>

<script src="./js/api.js"></script>
<script src="./js/app.js"></script>
<script src="./js/orders.js"></script>
<button id="scrollTop"><i class="fas fa-arrow-up"></i></button>
<script src="./js/scroll-top.js"></script>
</body>
</html>
