<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - GroceryHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header role="banner">
  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="logo">GroceryHub</div>
    <button onclick="window.location.href='cart.html'">← Back to Cart</button>
  </nav>
</header>

<main id="main-content" role="main">
  <section class="checkout">
    <h2>Checkout</h2>

    <form id="checkoutForm">

      <!-- Saved Addresses -->
      <div id="savedAddressesSection">
        <label>Select Delivery Address</label>
        <div id="savedAddressList">
          <!-- Skeleton Loading -->
          <div class="sk-addr-card">
            <div class="sk-addr-row">
              <div class="sk-addr-radio"></div>
              <div style="flex:1">
                <div class="sk-line w60" style="margin-bottom:8px;"></div>
                <div class="sk-line w80" style="margin-bottom:6px;"></div>
                <div class="sk-line w40" style="margin-bottom:6px;"></div>
                <div class="sk-line w30"></div>
              </div>
            </div>
          </div>
          <div class="sk-addr-card">
            <div class="sk-addr-row">
              <div class="sk-addr-radio"></div>
              <div style="flex:1">
                <div class="sk-line w60" style="margin-bottom:8px;"></div>
                <div class="sk-line w80" style="margin-bottom:6px;"></div>
                <div class="sk-line w40" style="margin-bottom:6px;"></div>
                <div class="sk-line w30"></div>
              </div>
            </div>
          </div>
        </div>
        <p><a href="address.html" style="color:#2E7D32;font-weight:bold;">+ Add / Manage Addresses</a></p>
      </div>

      <hr style="margin:15px 0;border-color:#eee;">

      <!-- Payment Method -->
      <label for="payment">Payment Method</label>
      <select id="payment" required>
        <option value="Cash on Delivery">Cash on Delivery</option>
        <option value="UPI">UPI</option>
        <option value="Card">Card</option>
      </select>

      <!-- COD Info -->
      <div id="codInfo" class="payment-info-box" style="display:none;background:#FFF3E0;border-left:4px solid #FF9800;padding:15px;border-radius:8px;">
        <strong>You will pay on delivery.</strong> No online payment required.
      </div>

      <!-- UPI Section -->
      <div id="upiSection" class="payment-info-box" style="display:none;text-align:center;background:#E8F5E9;border-left:4px solid #2E7D32;padding:20px;border-radius:8px;">
        <div style="font-size:80px;margin-bottom:10px;">📱</div>
        <p style="font-weight:bold;font-size:16px;color:#1B4332;">Scan & Pay via UPI</p>
        <div style="background:white;width:200px;height:200px;margin:15px auto;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(0,0,0,.1);">
          <div style="font-size:160px;opacity:0.3;">▨</div>
        </div>
        <p style="color:#666;font-size:14px;">or enter UPI ID: <strong style="color:#2E7D32;">groceryhub@upi</strong></p>
      </div>

      <!-- Card Section -->
      <div id="cardSection" class="payment-info-box" style="display:none;background:white;border:1px solid #ddd;padding:20px;border-radius:12px;">
        <p style="font-weight:bold;font-size:16px;color:#1B4332;margin-bottom:15px;">💳 Card Details</p>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <label for="cardNumber" style="font-size:13px;font-weight:600;color:#4a5568;margin-bottom:-4px;">Card Number</label>
          <input type="text" id="cardNumber" aria-label="Card Number" placeholder="Card Number" maxlength="19" style="padding:14px;font-size:16px;border:1px solid #ddd;border-radius:8px;outline:none;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label for="cardExpiry" style="font-size:13px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px;">Expiry</label>
              <input type="text" id="cardExpiry" aria-label="Card Expiry Date" placeholder="MM/YY" maxlength="5" style="width:100%;padding:14px;font-size:16px;border:1px solid #ddd;border-radius:8px;outline:none;">
            </div>
            <div>
              <label for="cardCvv" style="font-size:13px;font-weight:600;color:#4a5568;display:block;margin-bottom:4px;">CVV</label>
              <input type="text" id="cardCvv" aria-label="Card CVV" placeholder="CVV" maxlength="4" style="width:100%;padding:14px;font-size:16px;border:1px solid #ddd;border-radius:8px;outline:none;">
            </div>
          </div>
          <label for="cardHolder" style="font-size:13px;font-weight:600;color:#4a5568;margin-bottom:-4px;">Card Holder</label>
          <input type="text" id="cardHolder" aria-label="Card Holder Name" placeholder="Card Holder Name" style="padding:14px;font-size:16px;border:1px solid #ddd;border-radius:8px;outline:none;">
        </div>
      </div>

      <!-- Extra Payment Area (for UPI/Card Pay Now button) -->
      <div id="paymentExtra" style="display:none;text-align:center;margin-top:10px;">
        <button type="button" id="payNowBtn" class="shop-btn" style="padding:16px 50px;font-size:18px;display:inline-flex;align-items:center;gap:10px;">
          <span id="payNowText">Pay Now</span>
          <span id="payNowSpinner" style="display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite;"></span>
        </button>
      </div>

      <!-- Coupon Code Section -->
      <div class="coupon-section" style="margin:20px 0;padding:20px;background:#F8FAF8;border-radius:12px;border:1px solid #e2e8f0;">
        <div id="couponFormContainer">
          <label for="couponInput" style="font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;"><i class="fas fa-tag" style="color:#2E7D32;"></i> Have a coupon?</label>
          <div style="display:flex;gap:10px;">
            <input type="text" id="couponInput" placeholder="Enter coupon code" style="flex:1;padding:12px 16px;border:2px solid #e2e8f0;border-radius:8px;font-size:14px;text-transform:uppercase;outline:none;font-family:inherit;" maxlength="20">
            <button type="button" id="applyCouponBtn" class="shop-btn" style="padding:12px 24px;white-space:nowrap;font-size:14px;"><i class="fas fa-check"></i> Apply</button>
          </div>
          <div id="couponMessage" style="margin-top:8px;font-size:13px;min-height:20px;"></div>
        </div>
        <div id="couponAppliedContainer" style="display:none;">
          <div style="display:flex;justify-content:space-between;align-items:center;background:#E8F5E9;border:1px solid #66BB6A;border-radius:10px;padding:14px 18px;">
            <div>
              <span style="font-weight:700;color:#2E7D32;font-size:14px;"><i class="fas fa-check-circle"></i> <span id="appliedCouponCode">SAVE20</span></span>
              <span style="display:block;color:#4a5568;font-size:13px;margin-top:2px;">Discount applied!</span>
            </div>
            <button type="button" id="removeCouponBtn" style="background:none;border:none;color:#E53935;cursor:pointer;font-size:20px;padding:4px 8px;" aria-label="Remove coupon"><i class="fas fa-times-circle"></i></button>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="order-summary">
        <h3>Order Summary</h3>
        <p>Products Total: ₹<span id="summaryTotal">0</span></p>
        <p id="couponDiscountRow" style="display:none;color:#2E7D32;">Coupon Discount: −₹<span id="couponDiscountAmount">0</span></p>
        <h2 style="margin-top:15px;">Grand Total: ₹<span id="grandTotal">0</span></h2>
      </div>

      <!-- Message Area -->
      <p id="checkoutMessage" style="text-align:center;font-weight:bold;min-height:24px;"></p>

      <!-- Submit Button -->
      <button class="shop-btn" type="submit" id="placeOrderBtn" style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;">
        <span id="btnText">Place Order</span>
        <span id="btnSpinner" style="display:none;width:20px;height:20px;border:3px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.6s linear infinite;"></span>
      </button>

    </form>
  </section>
</main>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script src="./js/api.js"></script>
<script src="./js/checkout.js"></script>
<button id="scrollTop"><i class="fas fa-arrow-up"></i></button>
<script src="./js/scroll-top.js"></script>
</body>
</html>
