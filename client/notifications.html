<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - GroceryHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <style>
        .notif-page{max-width:800px;margin:40px auto;padding:0 20px}
        .notif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;flex-wrap:wrap;gap:15px}
        .notif-header h1{font-size:28px;color:#333;margin:0}
        .notif-actions{display:flex;gap:10px}
        .notif-actions button{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px}
        .btn-mark-read{background:#1976D2;color:#fff}
        .btn-mark-read:hover{background:#1565C0}
        .btn-delete-all{background:#E53935;color:#fff}
        .btn-delete-all:hover{background:#C62828}
        .notif-list{display:flex;flex-direction:column;gap:10px}
        .notif-card{display:flex;align-items:flex-start;gap:15px;padding:18px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,0.08);transition:all 0.2s;cursor:pointer;position:relative}
        .notif-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.12);transform:translateY(-1px)}
        .notif-card.unread{border-left:3px solid #1976D2;background:#F5F9FF}
        .notif-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
        .notif-content{flex:1;min-width:0}
        .notif-title{font-weight:600;font-size:15px;color:#333;margin-bottom:3px}
        .notif-message{font-size:13px;color:#666;line-height:1.4}
        .notif-time{font-size:11px;color:#999;margin-top:6px}
        .notif-delete{position:absolute;top:12px;right:12px;background:none;border:none;color:#ccc;cursor:pointer;font-size:14px;padding:4px}
        .notif-delete:hover{color:#E53935}
        .notif-empty{text-align:center;padding:60px 20px;color:#999}
        .notif-empty i{font-size:64px;color:#e0e0e0;margin-bottom:20px}
        .notif-empty h3{color:#666;margin:0 0 10px}
        .notif-empty p{color:#999;margin:0}
        .notif-skeleton{padding:18px;background:#fff;border-radius:10px;margin-bottom:10px}
        .notif-skeleton .sk-line{height:14px;background:#f0f0f0;border-radius:4px;margin-bottom:8px}
        .notif-skeleton .sk-line:last-child{width:40%}
        .notif-badge{display:inline-block;background:#E53935;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:8px}
    </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header role="banner">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="logo"> GroceryHub</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#offers">Offers</a></li>
            <li><a href="orders.html">Orders</a></li>
            <li><a href="wishlist.html">Wishlist</a></li>
        </ul>
        <div class="nav-actions">
            <button class="login-btn"><i class="fa-solid fa-user"></i> Login</button>
        </div>
    </nav>
</header>
<main id="main-content" role="main">
    <div class="notif-page">
        <div class="notif-header">
            <h1><i class="fa-solid fa-bell" style="color:#1976D2;"></i> Notifications</h1>
            <div class="notif-actions">
                <button class="btn-mark-read" onclick="markAllRead()" id="markAllBtn" title="Mark all as read">
                    <i class="fa-solid fa-check-double"></i> Mark All Read
                </button>
                <button class="btn-delete-all" onclick="deleteAll()" id="deleteAllBtn" title="Delete all notifications">
                    <i class="fa-solid fa-trash"></i> Delete All
                </button>
            </div>
        </div>
        <div class="notif-list" id="notifList">
            <div class="notif-skeleton" id="skel1"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
            <div class="notif-skeleton" id="skel2"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
            <div class="notif-skeleton" id="skel3"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>
        </div>
        <div id="notifEmpty" class="notif-empty" style="display:none">
            <i class="fa-solid fa-bell-slash"></i>
            <h3>No notifications</h3>
            <p>You're all caught up! Check back later for updates.</p>
        </div>
        <div id="pagination" class="pagination" style="margin-top:20px"></div>
    </div>
</main>
<footer role="contentinfo" style="background:#1a1a2e;color:#fff;padding:20px;text-align:center;margin-top:60px">
    <p>© 2026 GroceryHub | All Rights Reserved</p>
</footer>
<script src="./js/api.js"></script>
<script src="./js/app.js"></script>
<script src="./js/notifications.js"></script>
<button id="scrollTop"><i class="fas fa-arrow-up"></i></button>
<script src="./js/scroll-top.js"></script>
</body>
</html>
